<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Voidlight Admin</title>
<style>
  :root { color-scheme: dark; --bg: #07060f; --panel: #120e24; --panel2: #1a1533; --line: rgba(160, 130, 255, 0.22); --line2: rgba(160, 130, 255, 0.4); --text: #ece8ff; --muted: #9a93c0; --accent: #a55cff; --gold: #ffd24c; --good: #6bff8f; --bad: #ff5c7a; --edit: #ffb84c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: var(--text); }
  button { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--accent); background: rgba(165, 92, 255, 0.14); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: linear-gradient(90deg, #7a3cff, #c04cff); border: none; font-weight: 700; }
  button.small { padding: 2px 8px; font-size: 12px; }
  button.link { background: none; border: none; color: var(--muted); text-decoration: underline; padding: 0 4px; }
  button.on { border-color: var(--accent); background: rgba(165, 92, 255, 0.28); }
  input, select, textarea { background: #0b0919; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 100%; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  input[type=checkbox] { width: auto; accent-color: var(--accent); }
  input[type=color] { padding: 0; height: 30px; width: 44px; cursor: pointer; }
  input[type=range] { padding: 0; accent-color: var(--accent); }
  textarea { resize: vertical; min-height: 54px; }
  code { color: var(--muted); font-size: 12px; }
  h2 { font-size: 18px; margin: 0 0 12px; } h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 18px 0 8px; }

  /* sign-in gate */
  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #gate[hidden] { display: none; }
  .gatecard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: min(420px, 100%); text-align: center; box-shadow: 0 0 60px rgba(165, 92, 255, 0.15); }
  .gatecard h1 { margin: 0 0 4px; letter-spacing: 0.12em; font-size: 30px; background: linear-gradient(90deg, #ff8a3d, #ff4cc3, #7fdcff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .gatecard p { color: var(--muted); }
  .google { background: #fff !important; color: #1f1f1f; border: none; font-weight: 600; padding: 10px 18px; font-size: 15px; }

  /* app shell */
  #app[hidden] { display: none; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(7, 6, 15, 0.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex-wrap: wrap; }
  .brand { font-weight: 800; letter-spacing: 0.14em; }
  .brand span { color: var(--muted); font-weight: 500; letter-spacing: 0.04em; }
  .spacer { flex: 1; }
  .pill { font-size: 12px; border-radius: 99px; padding: 3px 10px; border: 1px solid var(--line); color: var(--muted); }
  .pill.dirty { color: var(--edit); border-color: rgba(255, 184, 76, 0.5); }
  .pill.clean { color: var(--good); border-color: rgba(107, 255, 143, 0.4); }
  .who { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 4px; padding: 0 16px 8px; overflow-x: auto; }
  nav button { border-radius: 8px 8px 0 0; border-bottom: none; }
  main { padding: 16px; }

  /* item & character editors */
  .editor { display: grid; gap: 16px; grid-template-columns: 220px minmax(300px, 1fr) minmax(360px, 1.25fr); align-items: start; }
  .list { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 112px; max-height: calc(100vh - 128px); overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 8px; text-align: left; padding: 7px 10px; border-left: 3px solid var(--c, var(--line)); width: 100%; }
  .row.sel { background: rgba(165, 92, 255, 0.2); border-color: var(--accent); border-left-color: var(--c, var(--accent)); }
  .row .ico { font-size: 18px; width: 24px; text-align: center; }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row .tag { font-size: 11px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--edit); flex: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card > h2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card > h2 .big { font-size: 26px; }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
  .f { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .f.wide { grid-column: 1 / -1; }
  .f > label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .f.changed > label:first-child { color: var(--edit); }
  .f.changed > label:first-child::after { content: 'edited'; font-size: 10px; border: 1px solid rgba(255,184,76,0.5); border-radius: 4px; padding: 0 4px; order: 1; }
  .f .reset { margin-left: auto; font-size: 11px; order: 2; display: none; }
  .f.changed > label:first-child > .reset { display: inline; }
  .f .hint { font-size: 11px; color: var(--muted); }
  .inline { display: flex; gap: 8px; align-items: center; }
  .inline > input[type=range] { flex: 1; }
  .inline > input[type=number] { width: 80px; }
  .check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .shapes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

  /* test canvas */
  .canvaspane { position: sticky; top: 112px; }
  .stage { position: relative; border: 1px solid var(--line2); border-radius: 12px; overflow: hidden; background: #07060f; height: min(520px, 60vh); }
  .stage iframe { border: 0; width: 100%; height: 100%; display: block; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
  .controls .grp { display: flex; gap: 3px; align-items: center; }
  .controls .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .controls select { width: auto; }
  .readout { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* tables */
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid rgba(160, 130, 255, 0.1); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td input[type=number] { width: 84px; }
  td input[type=text] { min-width: 120px; }
  td.changed input, td.changed select { border-color: var(--edit); }
  .stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); margin-bottom: 8px; }
  .stat b { font-size: 26px; display: block; } .stat small { color: var(--muted); }
  .preview { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; border: 2px solid var(--c); border-radius: 12px; padding: 14px; width: 190px; box-shadow: 0 0 18px color-mix(in srgb, var(--c) 40%, transparent); }
  .preview .avatar { font-size: 30px; color: var(--c); text-shadow: 0 0 14px var(--c); }
  .preview small { color: var(--muted); } .preview .perk { font-size: 12px; color: #c9f; }

  #toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 20; pointer-events: none; width: min(520px, calc(100% - 32px)); }
  .toast { background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 14px; text-align: center; animation: fade 4s forwards; }
  .toast.bad { border-color: var(--bad); }
  @keyframes fade { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }

  @media (max-width: 1200px) { .editor { grid-template-columns: 200px minmax(0, 1fr); } .canvaspane { grid-column: 2; position: static; } }
  @media (max-width: 760px) {
    header { position: static; } main { padding: 12px; } .editor { grid-template-columns: minmax(0, 1fr); } .canvaspane { grid-column: auto; }
    .list { position: static; flex-direction: row; overflow-x: auto; max-height: none; } .row { width: auto; flex: none; }
    .fields { grid-template-columns: minmax(0, 1fr); } .stage { height: 360px; }
  }
</style>
</head>
<body>
<div id="gate"><div class="gatecard">
  <h1>VOIDLIGHT</h1>
  <p style="margin-top:0">Content admin</p>
  <div id="gateBody"><p>Loading…</p></div>
</div></div>

<div id="app" hidden>
  <header>
    <div class="bar">
      <div class="brand">VOIDLIGHT <span>admin</span></div>
      <span class="pill" id="status"></span>
      <div class="spacer"></div>
      <button id="btnDraft" title="Save your edits to Firestore without changing the game">Save draft</button>
      <button id="btnPublish" class="primary" title="Players get these changes on their next load">Publish to game</button>
      <button id="btnExport" title="Download src/items.js with these changes written in">Export items.js</button>
      <select id="more" style="width:auto"><option value="">More…</option><option value="live">Discard edits (back to live)</option><option value="draft">Load saved draft</option><option value="defaults">Reset everything to items.js defaults</option></select>
      <span class="who" id="who"></span>
      <button class="link" id="btnSignOut">Sign out</button>
    </div>
    <nav id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>
<div id="toasts"></div>

<script src="src/firebase-config.js"></script>
<script src="src/core.js"></script>
<script src="src/items.js"></script>
<script src="src/content.js"></script>
<script type="module" src="src/admin.js"></script>
</body>
</html>
